<svg viewBox="0 0 650 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="650" height="190" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="325.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Three-Step Atomic Swap</text><rect x="20" y="50" width="195" height="60" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="117.5" y="83.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">1. Serving pointer → trie A</text><rect x="249" y="50" width="195" height="60" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="346.5" y="77.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">2. Build off to side</text><text x="346.5" y="89.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">pointer still → A</text><line x1="215" y1="80.0" x2="249" y2="80.0" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="478" y="50" width="195" height="60" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5,3"/><text x="575.5" y="83.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">3. Flip pointer → trie B</text><rect x="635" y="41" width="34" height="16" rx="8" fill="#e8590c"/><text x="652" y="53" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" font-weight="bold" fill="white">NEW</text><line x1="444" y1="80.0" x2="478" y2="80.0" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="140" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057" font-style="italic">in-flight reads finish on trie A; new reads follow trie B</text></svg>