<svg viewBox="0 0 950 250" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="950" height="250" fill="#ffffff"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/></marker></defs><text x="20" y="24" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#166534">Block store &amp; notification — choose availability</text>
<rect x="20" y="40" width="260" height="55" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="150.0" y="63.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#166534">blocks immutable,</text>
<text x="150.0" y="78.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#166534">nudges best-effort</text>
<rect x="320" y="40" width="220" height="55" rx="10" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
<text x="430.0" y="64.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#ffffff">read block /</text>
<text x="430.0" y="80.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#ffffff">deliver nudge</text>
<rect x="590" y="40" width="230" height="55" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="705.0" y="63.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" fill="#166534">serve anyway</text>
<text x="705.0" y="78.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" fill="#166534">(poll fallback catches misses)</text>
<line x1="280" y1="67" x2="320" y2="67" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="540" y1="67" x2="590" y2="67" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="20" y="150" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#991b1b">Commit path — chooses consistency</text>
<rect x="20" y="165" width="220" height="55" rx="10" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
<text x="130.0" y="189.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#ffffff">commit under</text>
<text x="130.0" y="205.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#ffffff">partition</text>
<polygon points="400,137.0 530.0,192 400,247.0 270.0,192" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
<text x="400" y="189" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#ffffff">can it see the true</text>
<text x="400" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#ffffff">current version?</text>
<rect x="650" y="165" width="280" height="55" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="790.0" y="188.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" fill="#991b1b">no — reject the commit rather</text>
<text x="790.0" y="203.5" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" fill="#991b1b">than risk a silent fork</text>
<line x1="240" y1="192" x2="270" y2="192" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530" y1="192" x2="650" y2="192" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/></svg>