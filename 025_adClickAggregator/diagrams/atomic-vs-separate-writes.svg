<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="280" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Atomic Commit vs. Separate Writes</text><text x="20" y="30" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Atomic commit — replay is a no-op:</text><rect x="20" y="45" width="210" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="125.0" y="67.08333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">aggregate update + offset</text><text x="125.0" y="78.58333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">committed as one unit</text><rect x="264" y="45" width="210" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="369.0" y="72.83333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">restart replays event</text><line x1="230" y1="70.0" x2="264" y2="70.0" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="508" y="45" width="210" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="613.0" y="67.08333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">event_id already reflected —</text><text x="613.0" y="78.58333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">skip</text><line x1="474" y1="70.0" x2="508" y2="70.0" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="150" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Separate writes — crash between them double-counts:</text><rect x="20" y="165" width="210" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="125.0" y="192.83333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">apply event to aggregate</text><rect x="264" y="165" width="210" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="369.0" y="192.83333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">crash before offset commit</text><line x1="230" y1="190.0" x2="264" y2="190.0" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="508" y="165" width="210" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="613.0" y="187.08333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">restart replays event —</text><text x="613.0" y="198.58333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">counted twice</text><line x1="474" y1="190.0" x2="508" y2="190.0" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>