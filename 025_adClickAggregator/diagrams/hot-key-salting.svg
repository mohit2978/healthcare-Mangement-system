<svg viewBox="0 0 650 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="650" height="260" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="325.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Hot-Key Salting: Before and After</text><text x="20" y="30" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Before — one hot key:</text><rect x="20" y="45" width="220" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="130.0" y="68.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">campaign_id: viral</text><rect x="300" y="45" width="300" height="40" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5" stroke-dasharray="5,3"/><text x="450.0" y="68.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">1 partition, overloaded</text><rect x="562" y="36" width="34" height="16" rx="8" fill="#e8590c"/><text x="579" y="48" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" font-weight="bold" fill="white">NEW</text><line x1="240" y1="65" x2="300" y2="65" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="130" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">After — salted across N:</text><rect x="20" y="145" width="150" height="32" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="95.0" y="164.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">viral:0</text><rect x="20" y="182" width="150" height="32" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="95.0" y="201.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">viral:1</text><rect x="20" y="219" width="150" height="32" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="95.0" y="238.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">viral:2</text><rect x="300" y="175" width="300" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="450.0" y="198.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">sum sub-counts at query time</text><path d="M170,161 Q240,170 300,190" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M170,198 Q240,200 300,195" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M170,235 Q240,225 300,200" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>