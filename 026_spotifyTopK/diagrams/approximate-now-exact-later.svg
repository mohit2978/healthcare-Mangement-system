<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Approximate Now, Exact Later</text><rect x="20" y="20" width="220" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="130.0" y="46.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Fast shards</text><rect x="300" y="20" width="250" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="425.0" y="45.666666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">approximate top-K for current hour</text><line x1="240" y1="42" x2="300" y2="42" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="100" width="220" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="130.0" y="119.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">Top-K cache (window open —</text><text x="130.0" y="130.66666666666669" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">reads see approximate)</text><path d="M420,65 Q275,85 130,100" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="190" width="250" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="145.0" y="209.58333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">Object storage: closed window's raw</text><text x="145.0" y="221.08333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">events</text><rect x="320" y="190" width="180" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="410.0" y="216.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Batch job</text><line x1="270" y1="212" x2="320" y2="212" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="550" y="190" width="130" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="615.0" y="209.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">recompute exact</text><text x="615.0" y="221.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">top-K</text><line x1="500" y1="212" x2="550" y2="212" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="320" y="260" width="250" height="32" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="445.0" y="273.1666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">overwrite closed window</text><text x="445.0" y="284.1666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">(idempotent) → Top-K cache</text><path d="M615,235 Q530,250 445,260" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>