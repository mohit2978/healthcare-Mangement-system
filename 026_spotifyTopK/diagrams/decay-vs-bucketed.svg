<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="220" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Exponential Decay vs. Bucketed Sums</text><text x="20" y="30" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Exponential decay (smooth recency):</text><rect x="20" y="45" width="200" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="120.0" y="70.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">one counter set</text><rect x="254" y="45" width="200" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="354.0" y="70.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">scale down each interval</text><line x1="220" y1="67.5" x2="254" y2="67.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="488" y="45" width="200" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="588.0" y="64.41666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">recent weighted, no hard</text><text x="588.0" y="76.91666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">edge</text><line x1="454" y1="67.5" x2="488" y2="67.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="145" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Bucketed sums (hard window edges):</text><rect x="20" y="160" width="200" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="120.0" y="185.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">minute buckets</text><rect x="254" y="160" width="200" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="354.0" y="185.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Σ last N buckets</text><line x1="220" y1="182.5" x2="254" y2="182.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="488" y="160" width="200" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="588.0" y="185.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">exact window, flat weighting</text><line x1="454" y1="182.5" x2="488" y2="182.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>