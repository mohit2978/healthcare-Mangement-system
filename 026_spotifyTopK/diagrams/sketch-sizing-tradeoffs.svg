ke-width="1.5"/><text x="535.0" y="114.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">tight estimates</text><line x1="170" y1="111" x2="210" y2="111" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="400" y1="111" x2="440" y2="111" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="150" width="150" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="95.0" y="174.16666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">more rows (depth)</text><rect x="210" y="150" width="190" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="305.0" y="174.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">less noise per cell</text><rect x="440" y="150" width="190" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="535.0" y="174.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">min across rows</text><line x1="170" y1="171" x2="210" y2="171" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="400" y1="171" x2="440" y2="171" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="325" y="230" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">error ∝ volume / width</text></svg>