<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="460" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">The Composed Design</text><rect x="20" y="20" width="420" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="230.0" y="44.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Client</text><line x1="230" y1="62" x2="230" y2="90" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="90" width="420" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="230.0" y="114.16666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Ingest API</text><line x1="230" y1="132" x2="230" y2="160" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="160" width="420" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="230.0" y="184.16666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Log-based queue (by item_id)</text><line x1="230" y1="202" x2="230" y2="230" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="230" width="420" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="230.0" y="254.16666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Shard: sketch + bucketed windows (×N)</text><line x1="230" y1="272" x2="230" y2="300" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="300" width="420" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="230.0" y="324.1666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Coordinator, K-way merge</text><line x1="230" y1="342" x2="230" y2="370" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="370" width="420" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="230.0" y="394.1666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Top-K results cache → Query API → Client</text><text x="20" y="435" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#495057">Separately: Log-based queue → Object storage → Batch job, exact → overwrite closed → Top-K results cache</text></svg>