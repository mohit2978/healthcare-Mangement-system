services:
  mongodb:
    image: mongo:8.2.3
    container_name: mongodb
    ports:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=rootpassword
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --quiet 'mongodb://root:rootpassword@localhost:27017/admin' --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    volumes:
      - ./deployment/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - mongo-data:/data/db

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:rootpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: secret
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    ports:
      - "9092"
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092" ]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      # Enables automatic topic creation on the broker.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # KRaft settings
      # The unique identifier for this Kafka node in the cluster.
      KAFKA_NODE_ID: 1
      # Defines the roles of this node. 'broker,controller' means it acts as both a broker and a KRaft controller.
      KAFKA_PROCESS_ROLES: 'broker,controller'
      # The list of voters in the KRaft controller quorum. For a single-node setup, it's just itself.
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      # Listener settings
      # The listener name used by the KRaft controller.
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # The listener name for communication between brokers.
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      # Maps listener names to security protocols.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      # The listeners advertised to clients. 'PLAINTEXT://kafka:29092' is for internal communication,
      # and 'PLAINTEXT_HOST://localhost:9092' is for external clients on the host machine.
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092'
      # The listeners that the broker will bind to. Use 0.0.0.0 to listen on all interfaces.
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://kafka:9092'
      # Cluster and topic settings
      # A unique ID for the Kafka cluster, required for KRaft mode.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # The replication factor for the internal offsets' topic. '1' is required for a single-node setup.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # The replication factor for the transaction state log. '1' is required for a single-node setup.
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # The minimum number of in-sync replicas for the transaction state log. '1' is required for a single-node setup.
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Development settings
      # The delay before the first rebalance for a consumer group. '0' speeds up startup in development.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Sets the root logger level for Kafka's Log4j logging to reduce noise.
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'ERROR'
      # Broker-wide maximum message size (10MB)
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      # Must also adjust the replica fetch size to handle the larger messages
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    restart: on-failure

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8181:8080"
    environment:
      JAVA_OPTS: "-Xmx512m -Xms128m"
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: 'kafka-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka:9092'
      AUTH_TYPE: 'LOGIN_FORM'
      SPRING_SECURITY_USER_NAME: 'admin'
      SPRING_SECURITY_USER_PASSWORD: 'secret'
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    container_name: mailpit
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATABASE=/data/mailpit.db
      # If true; accept any username/password (perfect for local testing)
      - MP_SMTP_AUTH_ACCEPT_ANY=false
      # Optional: Secure the Web UI itself (e.g., noreplyadmin@email.com:secret)
      - MP_UI_AUTH=noreplyadmin@email.com:secret
    ports:
      - "1025" # SMTP port
      - "8025:8025" # Web UI port
    healthcheck:
      # Built-in readyz command is the most reliable way to check health
      test: [ "CMD", "/mailpit", "readyz" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - mail-data:/data/mailpit.db

  admin-service:
    build:
      context: ./admin-service
    image: admin-service:v1.0.0
    container_name: admin-service
    environment:
      - ADMIN_SERVICE_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - OTLP_METRICS_EXPORT_ENABLED=true
      - OTLP_METRICS_EXPORT_URL=http://otel-lgtm:4318/v1/metrics
      - OTLP_TRACING_EXPORT_ENABLED=true
      - OTLP_TRACING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_TRACING_EXPORT_URL=http://otel-lgtm:4318/v1/traces
      - OTLP_LOGGING_EXPORT_ENABLED=true
      - OTLP_LOGGING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_LOGGING_EXPORT_URL=http://otel-lgtm:4318/v1/logs
    ports:
      - "9093:8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  gateway-service:
    build:
      context: ./gateway-service
    image: gateway-service:v1.0.0
    container_name: gateway-service
    environment:
      - GATEWAY_SERVICE_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_BOOT_ADMIN_CLIENT_ENABLED=true
      - ADMIN_CLIENT_URL=http://admin-service:8080
      - ADMIN_CLIENT_INSTANCE_SERVICE_URL=http://gateway-service:8080
      - AUTH_SERVICE_BASE_URL=http://auth-service:8080
      - AUTH_SERVICE_URI=/api/v1/auth
      - DOCTOR_SERVICE_BASE_URL=http://doctor-service:8080
      - DOCTOR_SERVICE_URI=/api/v1/doctor
      - PATIENT_SERVICE_BASE_URL=http://patient-service:8080
      - PATIENT_SERVICE_URI=/api/v1/patient
      - APPOINTMENTS_SERVICE_BASE_URL=http://appointment-service:8080
      - APPOINTMENTS_SERVICE_URI=/api/v1/appointments
      - OTLP_METRICS_EXPORT_ENABLED=true
      - OTLP_METRICS_EXPORT_URL=http://otel-lgtm:4318/v1/metrics
      - OTLP_TRACING_EXPORT_ENABLED=true
      - OTLP_TRACING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_TRACING_EXPORT_URL=http://otel-lgtm:4318/v1/traces
      - OTLP_LOGGING_EXPORT_ENABLED=true
      - OTLP_LOGGING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_LOGGING_EXPORT_URL=http://otel-lgtm:4318/v1/logs
    ports:
      - "8080:8080" # Only gateway-service is exposed externally
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      admin-service:
        condition: service_healthy
    restart: always

  auth-service:
    build:
      context: ./auth-service
    image: auth-service:v1.0.0
    container_name: auth-service
    environment:
      - AUTH_SERVICE_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_BOOT_ADMIN_CLIENT_ENABLED=true
      - ADMIN_CLIENT_URL=http://admin-service:8080
      - ADMIN_CLIENT_INSTANCE_SERVICE_URL=http://auth-service:8080
      - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
      - JWT_SECRET=aHR0cHM6Ly93d3cueW91YmlsdW1hbWVyaWNhLmNvbS9sb2dpbi8=
      - JWT_EXPIRATION=600000
      - OTLP_METRICS_EXPORT_ENABLED=true
      - OTLP_METRICS_EXPORT_URL=http://otel-lgtm:4318/v1/metrics
      - OTLP_TRACING_EXPORT_ENABLED=true
      - OTLP_TRACING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_TRACING_EXPORT_URL=http://otel-lgtm:4318/v1/traces
      - OTLP_LOGGING_EXPORT_ENABLED=true
      - OTLP_LOGGING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_LOGGING_EXPORT_URL=http://otel-lgtm:4318/v1/logs
    ports:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      admin-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      gateway-service:
        condition: service_started
    restart: always

  doctor-service:
    build:
      context: ./doctor-service
    image: doctor-service:v1.0.0
    container_name: doctor-service
    environment:
      - DOCTOR_SERVICE_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_BOOT_ADMIN_CLIENT_ENABLED=true
      - ADMIN_CLIENT_URL=http://admin-service:8080
      - ADMIN_CLIENT_INSTANCE_SERVICE_URL=http://doctor-service:8080
      - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
      - OTLP_METRICS_EXPORT_ENABLED=true
      - OTLP_METRICS_EXPORT_URL=http://otel-lgtm:4318/v1/metrics
      - OTLP_TRACING_EXPORT_ENABLED=true
      - OTLP_TRACING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_TRACING_EXPORT_URL=http://otel-lgtm:4318/v1/traces
      - OTLP_LOGGING_EXPORT_ENABLED=true
      - OTLP_LOGGING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_LOGGING_EXPORT_URL=http://otel-lgtm:4318/v1/logs
    ports:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      admin-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      gateway-service:
        condition: service_started
    restart: always

  patient-service:
    build:
      context: ./patient-service
    image: patient-service:v1.0.0
    container_name: patient-service
    environment:
      - PATIENT_SERVICE_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_BOOT_ADMIN_CLIENT_ENABLED=true
      - ADMIN_CLIENT_URL=http://admin-service:8080
      - ADMIN_CLIENT_INSTANCE_SERVICE_URL=http://patient-service:8080
      - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
      - OTLP_METRICS_EXPORT_ENABLED=true
      - OTLP_METRICS_EXPORT_URL=http://otel-lgtm:4318/v1/metrics
      - OTLP_TRACING_EXPORT_ENABLED=true
      - OTLP_TRACING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_TRACING_EXPORT_URL=http://otel-lgtm:4318/v1/traces
      - OTLP_LOGGING_EXPORT_ENABLED=true
      - OTLP_LOGGING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_LOGGING_EXPORT_URL=http://otel-lgtm:4318/v1/logs
    ports:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      admin-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      gateway-service:
        condition: service_started
    restart: always

  appointment-service:
    build:
      context: ./appointment-service
    image: appointment-service:v1.0.0
    container_name: appointment-service
    environment:
      - APPOINTMENT_SERVICE_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_BOOT_ADMIN_CLIENT_ENABLED=true
      - ADMIN_CLIENT_URL=http://admin-service:8080
      - ADMIN_CLIENT_INSTANCE_SERVICE_URL=http://appointment-service:8080
      - MONGO_URI=mongodb://root:rootpassword@mongodb:27017/healthcare?authSource=admin
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - KAFKA_TOPIC=appointments
      - DOCTOR_SERVICE_URL=http://doctor-service:8080/api/v1/doctor
      - PATIENT_SERVICE_URL=http://patient-service:8080/api/v1/patient
      - OTLP_METRICS_EXPORT_ENABLED=true
      - OTLP_METRICS_EXPORT_URL=http://otel-lgtm:4318/v1/metrics
      - OTLP_TRACING_EXPORT_ENABLED=true
      - OTLP_TRACING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_TRACING_EXPORT_URL=http://otel-lgtm:4318/v1/traces
      - OTLP_LOGGING_EXPORT_ENABLED=true
      - OTLP_LOGGING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_LOGGING_EXPORT_URL=http://otel-lgtm:4318/v1/logs
    ports:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      admin-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      gateway-service:
        condition: service_started
      doctor-service:
        condition: service_started
      patient-service:
        condition: service_started
      kafka:
        condition: service_started
    restart: always

  notification-service:
    build:
      context: ./notification-service
    image: notification-service:v1.0.0
    container_name: notification-service
    environment:
      - NOTIFICATION_SERVICE_PORT=8080
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_BOOT_ADMIN_CLIENT_ENABLED=true
      - ADMIN_CLIENT_URL=http://admin-service:8080
      - ADMIN_CLIENT_INSTANCE_SERVICE_URL=http://notification-service:8080
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - KAFKA_GROUP_ID=appointment-notifications-group
      - KAFKA_TOPIC=appointments
      - MAIL_SERVER_HOST=mailpit
      - MAIL_SERVER_PORT=1025
      - MAIL_SERVER_USERNAME=noreplyadmin@email.com
      - MAIL_SERVER_PASSWORD=secret
      - OTLP_METRICS_EXPORT_ENABLED=true
      - OTLP_METRICS_EXPORT_URL=http://otel-lgtm:4318/v1/metrics
      - OTLP_TRACING_EXPORT_ENABLED=true
      - OTLP_TRACING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_TRACING_EXPORT_URL=http://otel-lgtm:4318/v1/traces
      - OTLP_LOGGING_EXPORT_ENABLED=true
      - OTLP_LOGGING_EXPORT_TRANSPORT-TYPE=http
      - OTLP_LOGGING_EXPORT_URL=http://otel-lgtm:4318/v1/logs
    ports:
      - "8080"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      admin-service:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      gateway-service:
        condition: service_started
      doctor-service:
        condition: service_started
      patient-service:
        condition: service_started
      appointment-service:
        condition: service_started
    restart: always

  ui-service:
    build:
      context: ./ui-component # Path to your ReactJS project
    image: ui-service:v1.0.0
    container_name: ui-service
    depends_on:
      gateway-service:
        condition: service_started
    ports:
      - "9090:80" # Expose the React app on port 9090
    restart: always

  otel-lgtm:
    ## Info: https://github.com/grafana/docker-otel-lgtm
    image: grafana/otel-lgtm:0.13.0
    container_name: otel-lgtm
    restart: unless-stopped
    ports:
      - '3000:3000'   # Grafana UI
      - '4317'        # OTLP gRPC
      - '4318'        # OTLP HTTP
    environment:
      - 'GF_PATHS_DATA=/data/grafana'
      - 'ENABLE_LOGS_ALL=true'
    volumes:
      - otel-lgtm_data:/data

volumes:
  mongo-data:
    driver: local
  mail-data:
    driver: local
  otel-lgtm_data:
    driver: local
