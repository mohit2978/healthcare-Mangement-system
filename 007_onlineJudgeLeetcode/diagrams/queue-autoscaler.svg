 stroke-width="1.6" marker-end="url(#arrow)"/><rect x="150" y="100" width="250" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="275.0" y="123.16666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Sandboxed worker pool</text><rect x="20" y="180" width="300" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="170.0" y="199.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">Autoscaler + pre-warm ↔ Durable queue</text><text x="170.0" y="210.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">(oldest-item age)</text><rect x="370" y="180" width="300" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="520.0" y="205.16666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">↔ Sandboxed worker pool (add/remove)</text><rect x="150" y="240" width="250" height="32" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="275.0" y="259.1666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Dead-letter queue</text><path d="M275,140 Q305,190 275,240" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="305" y="184" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">reliably crashes</text></svg>