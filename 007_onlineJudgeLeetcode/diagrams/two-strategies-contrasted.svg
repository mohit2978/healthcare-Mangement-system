<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="260" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Two Strategies Contrasted</text><text x="20" y="25" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#495057">Recompute on every read — cost tracks submission count:</text><rect x="10" y="35" width="130" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="75.0" y="60.333333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">a refresh</text><rect x="174" y="35" width="130" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="239.0" y="54.583333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">scan every</text><text x="239.0" y="66.08333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">submission</text><line x1="140" y1="57.5" x2="174" y2="57.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="338" y="35" width="130" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="403.0" y="54.583333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">per-contestant</text><text x="403.0" y="66.08333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">standing</text><line x1="304" y1="57.5" x2="338" y2="57.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="502" y="35" width="130" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="567.0" y="54.583333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">sort the</text><text x="567.0" y="66.08333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">contestants</text><line x1="468" y1="57.5" x2="502" y2="57.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="666" y="35" width="130" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="731.0" y="60.333333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">ranking</text><line x1="632" y1="57.5" x2="666" y2="57.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="135" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#495057">Maintain on write — reads never scan submissions:</text><rect x="20" y="150" width="190" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="115.0" y="173.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">accepted submission</text><rect x="250" y="150" width="170" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="335.0" y="173.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">1 update, O(log N)</text><line x1="210" y1="170" x2="250" y2="170" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="210" width="190" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="115.0" y="233.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">a refresh</text><rect x="250" y="210" width="170" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="335.0" y="232.83333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">1 lookup, O(log N + K)</text><line x1="210" y1="230" x2="250" y2="230" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="460" y="180" width="200" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="560.0" y="203.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">ranking</text><path d="M420,170 Q440,175 460,195" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M420,230 Q440,225 460,205" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>