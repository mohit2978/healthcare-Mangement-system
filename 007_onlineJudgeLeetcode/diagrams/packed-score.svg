<svg viewBox="0 0 700 170" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="170" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Packed Score Encoding</text><rect x="20" y="60" width="200" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="120.0" y="81.83333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">one score = one sortable</text><text x="120.0" y="94.83333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">number</text><rect x="280" y="20" width="380" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="470.0" y="39.583333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">problems solved (high-order bits) "more solved always</text><text x="470.0" y="51.083333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#1a1a2e">ranks higher"</text><rect x="280" y="90" width="380" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="470.0" y="109.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">inverted penalty time (low-order bits) "same solved →</text><text x="470.0" y="120.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#1a1a2e">less penalty ranks higher"</text><line x1="220" y1="60" x2="280" y2="60" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="210.0" y="41" width="80" height="14" fill="white" opacity="0.85"/><text x="250.0" y="54" text-anchor="middle" font-