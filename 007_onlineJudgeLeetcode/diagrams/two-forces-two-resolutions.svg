<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="220" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Two Forces, Two Resolutions</text><rect x="20" y="30" width="320" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="180.0" y="53.333333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">Code from a stranger, possibly hostile</text><line x1="360" y1="50" x2="400" y2="50" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="340.0" y="31" width="80" height="14" fill="white" opacity="0.85"/><text x="380.0" y="44" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">forces</text><rect x="400" y="30" width="280" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="540.0" y="53.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Never run it where it can hurt you</text><rect x="20" y="130" width="320" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="180.0" y="155.83333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">Contest opens: synchronized flood</text><line x1="360" y1="150" x2="400" y2="150" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="340.0" y="131" width="80" height="14" fill="white" opacity="0.85"/><text x="380.0" y="144" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">forces</text><rect x="400" y="130" width="280" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="540.0" y="149.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">Stay fair and responsive under a 10x</text><text x="540.0" y="161.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">spike</text><text x="400" y="90" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#495057" font-style="italic">resolved by → An isolated sandbox with hard resource limits</text><text x="400" y="190" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#495057" font-style="italic">resolved by → An autoscaling queue with fair dispatch</text></svg>