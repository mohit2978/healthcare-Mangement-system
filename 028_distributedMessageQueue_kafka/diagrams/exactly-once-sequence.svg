<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="260" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Exactly-Once: Read-Process-Write Transaction</text><rect x="25" y="30" width="150" height="34" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="100.0" y="50.666666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Processor</text><line x1="100" y1="64" x2="100" y2="220" stroke="#ced4da" stroke-width="1.5"/><rect x="265" y="30" width="150" height="34" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="340.0" y="50.666666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Input partition</text><line x1="340" y1="64" x2="340" y2="220" stroke="#ced4da" stroke-width="1.5"/><rect x="505" y="30" width="150" height="34" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="580.0" y="50.666666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Output topic</text><line x1="580" y1="64" x2="580" y2="220" stroke="#ced4da" stroke-width="1.5"/><path d="M100,90 Q220.0,75 340,90" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="220.0" y="105" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#495057" font-style="italic">(1) read msg at offset 10</text><path d="M100,130 Q340.0,115 580,130" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="340.0" y="145" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#495057" font-style="italic">(2) begin txn, write result</text><path d="M100,170 Q220.0,155 340,170" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="220.0" y="185" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#495057" font-style="italic">(3) commit offset 11, same txn</text><text x="350" y="235" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#495057" font-style="italic">crash before commit → txn aborts, redo from 10 · producer retry → broker drops duplicate by id+seq</text></svg>