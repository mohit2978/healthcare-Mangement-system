<svg viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="190" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Metric Types Roll Up Differently</text><rect x="20" y="30" width="260" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="150.0" y="54.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Counter (only goes up)</text><rect x="400" y="30" width="280" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="540.0" y="54.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">sum per-interval increase</text><line x1="280" y1="51" x2="400" y2="51" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300.0" y="32" width="80" height="14" fill="white" opacity="0.85"/><text x="340.0" y="45" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">rolls up by</text><rect x="20" y="85" width="260" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="150.0" y="109.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Gauge (current value)</text><rect x="400" y="85" width="280" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="540.0" y="109.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">last / avg / max</text><line x1="280" y1="106" x2="400" y2="106" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300.0" y="87" width="80" height="14" fill="white" opacity="0.85"/><text x="340.0" y="100" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">rolls up by</text><rect x="20" y="140" width="260" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="150.0" y="164.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Histogram (bucketed values)</text><rect x="400" y="140" width="280" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="540.0" y="164.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">merge buckets (keeps percentiles)</text><line x1="280" y1="161" x2="400" y2="161" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300.0" y="142" width="80" height="14" fill="white" opacity="0.85"/><text x="340.0" y="155" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">rolls up by</text></svg>