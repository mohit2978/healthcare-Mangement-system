<svg viewBox="0 0 680 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="260" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="340.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">The Firehose Forces Two Questions</text><rect x="230" y="20" width="220" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="340.0" y="36.75" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Firehose of points (never</text><text x="340.0" y="50.25" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">stops, never small)</text><rect x="30" y="100" width="260" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="126.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">"Store forever?" (too expensive)</text><rect x="390" y="100" width="260" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="520.0" y="119.25" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">"Track every series?" (cardinality</text><text x="520.0" y="132.75" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">explosion)</text><path d="M300,60 Q220,80 160,100" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="220" y="74" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">forces</text><path d="M370,60 Q460,80 520,100" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="460" y="74" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">forces</text><rect x="30" y="190" width="260" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="216.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Approximate: rollups + retention</text><rect x="390" y="190" width="260" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="520.0" y="216.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Bounded: cardinality limits</text><line x1="160" y1="145" x2="160" y2="190" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="168" y="171.5" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">resolved by</text><line x1="520" y1="145" x2="520" y2="190" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="528" y="171.5" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">resolved by</text></svg>