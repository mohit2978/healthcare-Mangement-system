<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg" font-family="Arial,Helvetica,sans-serif">
<rect x="0" y="0" width="760" height="240" fill="#ffffff"/>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b5563"/></marker>
<marker id="arrowb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111827"/></marker>
</defs>
<rect x="20" y="30" width="180" height="50" rx="10" fill="#3b82f6" stroke="#2563eb" stroke-width="1.5"/>
<text x="110.0" y="60.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#ffffff">1. reserve (hold)</text>
<rect x="250" y="30" width="180" height="50" rx="10" fill="#f97316" stroke="#ea580c" stroke-width="1.5"/>
<text x="340.0" y="60.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" fill="#ffffff">2. charge (payment)</text>
<rect x="480" y="20" width="220" height="60" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="590.0" y="46.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#166534">3. confirm:</text>
<text x="590.0" y="61.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#166534">sold + order (success)</text>
<rect x="250" y="150" width="220" height="60" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="360.0" y="184.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#991b1b">declined, or TTL lapses</text>
<rect x="480" y="150" width="260" height="60" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="610.0" y="176.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#78350f">compensate:</text>
<text x="610.0" y="191.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="600" fill="#78350f">release seat to available</text>
<line x1="200" y1="55" x2="250" y2="55" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430" y1="55" x2="480" y2="50" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="80" x2="340" y2="150" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<line x1="470" y1="180" x2="480" y2="180" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>