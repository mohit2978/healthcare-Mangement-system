<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="200" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Same Item, Opposite Needs on Each Side</text><rect x="30" y="70" width="300" height="90" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="180.0" y="111.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">MUST SERIALIZE every bid on one item races</text><text x="180.0" y="125.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">the same question</text><rect x="370" y="70" width="300" height="90" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="520.0" y="111.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">MUST BROADCAST one accepted bid must reach</text><text x="520.0" y="125.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">thousands of watchers</text><text x="350" y="115" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="14" fill="#495057">vs</text></svg>