<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">The Close: Guarded, Idempotent Update</text><rect x="20" y="20" width="260" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="150.0" y="46.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Bid in final window</text><rect x="320" y="20" width="320" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="480.0" y="46.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">ends_at pushed out (atomic accept + extend)</text><line x1="280" y1="42" x2="320" y2="42" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="150" y="100" width="260" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="280.0" y="116.83333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">Close scheduler: guarded update,</text><text x="280.0" y="129.83333333333331" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">status = open?</text><text x="280" y="155" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#495057" font-style="italic">at effective ends_at</text><polygon points="330.0,165 430,195.0 330.0,225 230,195.0" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/><text x="330.0" y="198.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">row changed?</text><rect x="30" y="250" width="260" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="275.8333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">yes: read log top, record one winner</text><rect x="400" y="250" width="260" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="530.0" y="269.3333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">no (zero rows): retry/ failover run —</text><text x="530.0" y="282.3333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">no-op</text><path d="M250,225 Q190,240 160,250" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190" y="234" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">yes</text><path d="M410,225 Q470,240 500,250" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="470" y="234" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">no</text></svg>