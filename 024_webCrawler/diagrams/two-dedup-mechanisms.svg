<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="220" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Two Dedup Mechanisms</text><text x="20" y="30" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">URL dedup — keyed on the address:</text><rect x="20" y="45" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="115.0" y="70.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">normalized URL</text><rect x="244" y="45" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="339.0" y="70.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">Bloom filter</text><line x1="210" y1="67.5" x2="244" y2="67.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="468" y="45" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="563.0" y="70.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">catches: same URL requeued</text><line x1="434" y1="67.5" x2="468" y2="67.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="150" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Content dedup — keyed on the bytes:</text><rect x="20" y="165" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="115.0" y="190.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">fetched page bytes</text><rect x="244" y="165" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="339.0" y="190.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">hash / simhash</text><line x1="210" y1="187.5" x2="244" y2="187.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="468" y="165" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="563.0" y="184.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">catches: different URL,</text><text x="563.0" y="196.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">same/near-same content</text><line x1="434" y1="187.5" x2="468" y2="187.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>