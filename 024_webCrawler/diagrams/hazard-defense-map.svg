<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="260" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Hazard-to-Defense Map</text><rect x="20" y="30" width="280" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="49.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">Infinite URL space (calendar, faceted</text><text x="160.0" y="61.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">search)</text><rect x="340" y="30" width="340" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="510.0" y="49.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">cap depth + per-host budget, normalize session</text><text x="510.0" y="61.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">ids</text><line x1="300" y1="52" x2="340" y2="52" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="85" width="280" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="110.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">Oversized or slow page</text><rect x="340" y="85" width="340" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="510.0" y="110.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">timeout + max page size</text><line x1="300" y1="107" x2="340" y2="107" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="140" width="280" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="165.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">Redirect loop</text><rect x="340" y="140" width="340" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="510.0" y="165.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">cap redirect chain length</text><line x1="300" y1="162" x2="340" y2="162" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="195" width="280" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="220.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">Host returns 429 / 403</text><rect x="340" y="195" width="340" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="510.0" y="220.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9" fill="#1a1a2e">auto back-off, don't retry harder</text><line x1="300" y1="217" x2="340" y2="217" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>