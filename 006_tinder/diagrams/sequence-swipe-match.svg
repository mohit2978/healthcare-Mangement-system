ike B)</text><path d="M280,115 Q370.0,100 460,115" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="370.0" y="130" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8" fill="#495057" font-style="italic">write A→B (shard(A)); read B→A (shard(B)) → hit</text><path d="M280,155 Q450.0,140 620,155" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="450.0" y="170" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#495057" font-style="italic">create match(A,B), insert-if-absent</text><path d="M620,195 Q350.0,235 80,220" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="350.0" y="210" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="8.5" fill="#495057" font-style="italic">matched: true, match_id</text></svg>