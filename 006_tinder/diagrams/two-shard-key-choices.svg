<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="220" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Two Shard-Key Choices</text><text x="20" y="30" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Shard by axis Y:</text><rect x="20" y="45" width="300" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="170.0" y="68.33333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">query along Y → single shard, cheap</text><rect x="20" y="90" width="300" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="170.0" y="113.16666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">query along X → scattered, many shards</text><text x="380" y="30" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Shard by axis X:</text><rect x="380" y="45" width="300" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="530.0" y="68.33333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">query along X → single shard, cheap</text><rect x="380" y="90" width="300" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="530.0" y="113.16666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">query along Y → scattered, many shards</text></svg>