<svg viewBox="0 0 650 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="650" height="380" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="325.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Herd Mitigation: Shard, Jitter, Rate-Limit</text><rect x="120" y="20" width="400" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="320.0" y="44.333333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">Midnight bucket (huge share of daily jobs)</text><rect x="120" y="90" width="400" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="320.0" y="114.33333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">shard by (time_bucket, hash(job_id))</text><line x1="320" y1="57" x2="320" y2="90" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="120" y="160" width="400" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="320.0" y="184.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">jitter fire time across a window</text><line x1="320" y1="127" x2="320" y2="160" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="120" y="230" width="400" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="320.0" y="254.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">rate limiter caps drain rate</text><line x1="320" y1="197" x2="320" y2="230" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="120" y="300" width="400" height="42" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="320.0" y="324.3333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">Worker pool</text><line x1="320" y1="267" x2="320" y2="300" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>