<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="200" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Time-Bucketed Dispatch</text><rect x="20" y="30" width="180" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="110.0" y="56.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Billions of jobs</text><rect x="240" y="30" width="420" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="450.0" y="53.333333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">bucket t-1 | bucket t | bucket t+1 | ...</text><line x1="200" y1="52" x2="240" y2="52" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="180.0" y="33" width="80" height="14" fill="white" opacity="0.85"/><text x="220.0" y="46" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">bucketed by run_at minute</text><rect x="340" y="105" width="220" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="450.0" y="128.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">current minute's bucket</text><line x1="450" y1="70" x2="450" y2="105" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="320" y="165" width="260" height="30" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="450.0" y="183.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">due jobs — a tiny slice</text><line x1="450" y1="145" x2="450" y2="165" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>