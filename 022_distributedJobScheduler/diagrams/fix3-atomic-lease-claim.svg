<svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="210" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Fix 3: An Atomic Lease Claim</text><rect x="20" y="30" width="220" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="130.0" y="53.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Dispatcher 1 (first)</text><polygon points="360.0,20 450,50.0 360.0,80 270,50.0" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/><text x="360.0" y="53.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">"unclaimed?"</text><line x1="240" y1="50" x2="270" y2="50" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="490" y="30" width="190" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="585.0" y="53.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">yes: owner = D1, lease set</text><line x1="450" y1="50" x2="490" y2="50" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="130" width="220" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="130.0" y="153.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Dispatcher 2 (second)</text><polygon points="360.0,120 450,150.0 360.0,180 270,150.0" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/><text x="360.0" y="153.5" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">"unclaimed?"</text><line x1="240" y1="150" x2="270" y2="150" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="490" y="130" width="190" height="40" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="585.0" y="153.16666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">no: skip, already claimed</text><line x1="450" y1="150" x2="490" y2="150" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>