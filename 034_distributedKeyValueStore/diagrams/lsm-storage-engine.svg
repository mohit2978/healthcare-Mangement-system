<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="260" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">LSM Storage Engine</text><rect x="20" y="40" width="100" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="70.0" y="66.83333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="13" fill="#1a1a2e">put</text><rect x="160" y="30" width="190" height="60" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="255.0" y="56.583333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#1a1a2e">WAL + memtable (fast</text><text x="255.0" y="71.08333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#1a1a2e">append)</text><rect x="400" y="30" width="200" height="60" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="500.0" y="56.583333333333336" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#1a1a2e">Immutable SSTables (sorted</text><text x="500.0" y="71.08333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#1a1a2e">on disk)</text><line x1="120" y1="62" x2="160" y2="62" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="350" y1="62" x2="400" y2="62" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="335.0" y="43" width="80" height="14" fill="white" opacity="0.85"/><text x="375.0" y="56" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">flush when full</text><rect x="20" y="150" width="140" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="90.0" y="176.83333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="13" fill="#1a1a2e">get user:42</text><rect x="210" y="140" width="220" height="65" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="320.0" y="176.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#1a1a2e">Bloom filter per SSTable</text><line x1="160" y1="172" x2="210" y2="172" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="500" y="115" width="180" height="34" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="590.0" y="128.91666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">"definitely not": skip,</text><text x="590.0" y="141.41666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">no disk read</text><rect x="500" y="165" width="180" height="34" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="590.0" y="178.91666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">"maybe": open file, look</text><text x="590.0" y="191.41666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">up key</text><line x1="430" y1="150" x2="500" y2="150" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="430" y1="180" x2="500" y2="180" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>