<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="220" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="340.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Quorum Overlap (N=3, W=2, R=2)</text><rect x="20" y="80" width="140" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="90.0" y="109.33333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="13" fill="#1a1a2e">W = 2 of 3</text><rect x="20" y="150" width="140" height="50" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="90.0" y="179.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="13" fill="#1a1a2e">R = 2 of 3</text><polygon points="280.0,90 350,135.0 280.0,180 210,135.0" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/><text x="280.0" y="138.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">R + W &gt; N ?</text><line x1="160" y1="105" x2="210" y2="105" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="90" y1="130" x2="90" y2="150" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="400" y="60" width="260" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="530.0" y="79.16666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Yes: read reaches a node with the</text><text x="530.0" y="93.16666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">latest write</text><rect x="400" y="140" width="260" height="60" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="530.0" y="166.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">But concurrent writes: both win on</text><text x="530.0" y="180.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">different nodes → conflict</text><line x1="350" y1="110" x2="400" y2="110" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="335.0" y="77" width="80" height="14" fill="white" opacity="0.85"/><text x="375.0" y="90" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">yes</text><path d="M350,115 Q375,150 400,165" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>