<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="640" height="320" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="320.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Consistent Hash Ring: Key Placement</text><circle cx="320" cy="175" r="110" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,3"/><circle cx="390.7066370655193" cy="90.73511125691242" r="9" fill="#3b5bdb"/><text x="408.70469013674244" y="69.28586684958104" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Node A</text><circle cx="428.3288528313429" cy="194.10129954336233" r="9" fill="#3b5bdb"/><text x="455.9034699156847" y="198.9634485180364" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Node B</text><circle cx="357.62221576582357" cy="278.3661882864499" r="9" fill="#3b5bdb"/><text x="367.1987797789423" y="304.67758166845533" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Node C</text><circle cx="216.63381171355007" cy="212.62221576582357" r="9" fill="#ced4da"/><text x="190.32241833154464" y="222.1987797789423" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Node D</text><circle cx="249.29336293448065" cy="90.73511125691243" r="9" fill="#ced4da"/><text x="231.29530986325756" y="69.28586684958105" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">Node E</text><circle cx="320.0" cy="95.0" r="6" fill="#e8590c"/><text x="320.0" y="83.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#e8590c" font-weight="600">key</text><text x="320" y="175" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#495057" font-style="italic">hash(key) → clockwise</text><rect x="50" y="20" width="220" height="34" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="41.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="12" fill="#1a1a2e">key → hash onto ring</text><text x="320" y="300" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057" font-style="italic">preference list = next N distinct physical nodes clockwise: Node A, Node B, Node C</text></svg>