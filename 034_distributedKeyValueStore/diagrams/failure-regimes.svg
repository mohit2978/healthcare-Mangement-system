<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="260" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Two Failure Regimes</text><text x="20" y="55" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="13" fill="#495057">Transient — node unreachable</text><rect x="20" y="65" width="150" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="95.0" y="91.83333333333333" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="13" fill="#1a1a2e">Node briefly down</text><rect x="210" y="65" width="170" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="295.0" y="84.25" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Hinted handoff to next</text><text x="295.0" y="97.75" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">node</text><rect x="420" y="65" width="220" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="530.0" y="91.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Hand data back on recovery</text><line x1="170" y1="87" x2="210" y2="87" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="380" y1="87" x2="420" y2="87" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="150" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="13" fill="#495057">Permanent — long divergence</text><rect x="20" y="160" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="115.0" y="186.83333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="13" fill="#1a1a2e">Compare Merkle roots</text><rect x="250" y="160" width="200" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="350.0" y="179.25" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Walk diffs (differing</text><text x="350.0" y="192.75" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">branches only)</text><rect x="490" y="160" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="585.0" y="186.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">Send only out-of- sync keys</text><line x1="210" y1="182" x2="250" y2="182" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="450" y1="182" x2="490" y2="182" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>