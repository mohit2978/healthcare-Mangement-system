<svg viewBox="0 0 750 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (REQUIRED) -->
  <rect width="750" height="400" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="375" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Write Review: Async Fanout Architecture</text>

  <!-- Sync Path Label -->
  <rect x="40" y="55" width="130" height="25" rx="4" fill="#d1fae5"/>
  <text x="105" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Sync Path (fast)</text>

  <!-- User -->
  <rect x="40" y="100" width="100" height="60" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="90" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">User</text>

  <!-- API Gateway -->
  <rect x="200" y="100" width="120" height="60" rx="8" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="260" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">API Gateway</text>

  <!-- Review Service -->
  <rect x="380" y="100" width="120" height="60" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="440" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Review</text>
  <text x="440" y="146" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Service</text>

  <!-- Review DB -->
  <rect x="560" y="100" width="120" height="60" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="620" y="128" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Review DB</text>
  <text x="620" y="146" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(write + commit)</text>

  <!-- Sync path arrows -->
  <path d="M 140,130 L 195,130" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="195,130 185,125 185,135" fill="#27ae60"/>

  <path d="M 320,130 L 375,130" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="375,130 365,125 365,135" fill="#27ae60"/>

  <path d="M 500,130 L 555,130" stroke="#27ae60" stroke-width="2" fill="none"/>
  <polygon points="555,130 545,125 545,135" fill="#27ae60"/>

  <!-- Step numbers for sync -->
  <circle cx="168" cy="115" r="12" fill="#27ae60"/>
  <text x="168" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">1</text>

  <circle cx="348" cy="115" r="12" fill="#27ae60"/>
  <text x="348" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">2</text>

  <circle cx="528" cy="115" r="12" fill="#27ae60"/>
  <text x="528" y="119" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">3</text>

  <!-- Success response back -->
  <path d="M 555,145 Q 300,170 145,145" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>
  <polygon points="145,145 155,140 155,150" fill="#27ae60"/>
  <text x="330" y="175" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">success (fast)</text>

  <!-- Async Path Label -->
  <rect x="40" y="210" width="130" height="25" rx="4" fill="#fef3c7"/>
  <text x="105" y="227" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">Async Fanout</text>

  <!-- Message Queue -->
  <rect x="200" y="260" width="120" height="60" rx="8" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="260" y="288" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Message</text>
  <text x="260" y="306" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Queue</text>

  <!-- Worker -->
  <rect x="380" y="260" width="100" height="60" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="430" y="295" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Workers</text>

  <!-- Business DB (aggregates) -->
  <rect x="540" y="245" width="100" height="50" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="590" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Business DB</text>
  <text x="590" y="283" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(aggregates)</text>

  <!-- Search Index -->
  <rect x="540" y="305" width="100" height="50" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="590" y="328" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Search Index</text>
  <text x="590" y="343" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">(signals)</text>

  <!-- Publish event arrow -->
  <path d="M 440,160 L 440,200 Q 440,230 400,250 L 325,260" stroke="#e74c3c" stroke-width="2" fill="none"/>
  <polygon points="325,260 335,255 335,265" fill="#e74c3c"/>

  <!-- Queue to Worker arrow -->
  <path d="M 320,290 L 375,290" stroke="#e74c3c" stroke-width="2" fill="none"/>
  <polygon points="375,290 365,285 365,295" fill="#e74c3c"/>

  <!-- Worker to targets -->
  <path d="M 480,275 L 535,270" stroke="#f39c12" stroke-width="2" fill="none"/>
  <polygon points="535,270 525,265 525,275" fill="#f39c12"/>

  <path d="M 480,305 L 535,325" stroke="#f39c12" stroke-width="2" fill="none"/>
  <polygon points="535,325 525,320 525,330" fill="#f39c12"/>

  <!-- Async step labels -->
  <circle cx="400" cy="205" r="12" fill="#e74c3c"/>
  <text x="400" y="209" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">4</text>

  <circle cx="348" cy="275" r="12" fill="#e74c3c"/>
  <text x="348" y="279" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">5</text>

  <circle cx="510" cy="290" r="12" fill="#f39c12"/>
  <text x="510" y="294" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">6</text>

  <!-- Event label -->
  <text x="355" y="220" font-family="monospace" font-size="10" fill="#e74c3c">review_created</text>
</svg>
