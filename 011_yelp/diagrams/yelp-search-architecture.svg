<svg viewBox="0 0 750 370" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="750" height="370" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="375" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2c3e50">Search Architecture</text>

  <!-- User -->
  <rect x="30" y="155" width="100" height="60" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="80" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">User</text>

  <!-- API Gateway -->
  <rect x="190" y="155" width="120" height="60" rx="8" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="250" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">API Gateway</text>

  <!-- Search Service (read path, top) -->
  <rect x="390" y="75" width="120" height="60" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="450" y="103" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Search</text>
  <text x="450" y="121" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Service</text>

  <!-- Search Index -->
  <rect x="580" y="75" width="140" height="60" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="650" y="103" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Search Index</text>
  <text x="650" y="121" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(geo + text)</text>

  <!-- Business Service (write path, bottom) -->
  <rect x="390" y="240" width="120" height="60" rx="8" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="450" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Business</text>
  <text x="450" y="286" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Service</text>

  <!-- Business Database -->
  <rect x="580" y="240" width="140" height="60" rx="8" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>
  <text x="650" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Business DB</text>
  <text x="650" y="286" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">(source of truth)</text>

  <!-- Arrow: User → API Gateway -->
  <path d="M 130,185 L 185,185" stroke="#555" stroke-width="2" fill="none"/>
  <polygon points="185,185 175,180 175,190" fill="#555"/>

  <!-- Arrow: API Gateway → Search Service (read) -->
  <path d="M 310,170 L 385,115" stroke="#3498db" stroke-width="2" fill="none"/>
  <polygon points="385,115 375,115 380,125" fill="#3498db"/>

  <!-- Arrow: API Gateway → Business Service (write) -->
  <path d="M 310,200 L 385,255" stroke="#f39c12" stroke-width="2" fill="none"/>
  <polygon points="385,255 375,248 380,258" fill="#f39c12"/>

  <!-- Arrow: Search Service → Search Index -->
  <path d="M 510,105 L 575,105" stroke="#3498db" stroke-width="2" fill="none"/>
  <polygon points="575,105 565,100 565,110" fill="#3498db"/>

  <!-- Arrow: Business Service → Business DB -->
  <path d="M 510,270 L 575,270" stroke="#f39c12" stroke-width="2" fill="none"/>
  <polygon points="575,270 565,265 565,275" fill="#f39c12"/>

  <!-- Out of sync indicator -->
  <path d="M 650,140 L 650,235" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
  <text x="665" y="195" font-family="Arial, sans-serif" font-size="12" font-style="italic" fill="#e74c3c">out of sync?</text>

  <!-- Legends -->
  <rect x="30" y="55" width="100" height="25" rx="4" fill="#e3f2fd"/>
  <text x="80" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498db">Read Path</text>

  <rect x="145" y="55" width="100" height="25" rx="4" fill="#fef3e2"/>
  <text x="195" y="72" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#f39c12">Write Path</text>
</svg>
