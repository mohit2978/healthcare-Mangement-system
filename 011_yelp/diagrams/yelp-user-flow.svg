<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <rect width="800" height="320" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Yelp User Flow: What We're Building</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>

  <!-- Flow 1: Search -->
  <g transform="translate(40, 50)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="120" height="200" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
    <rect x="6" y="22" width="108" height="155" rx="4" fill="#fff"/>

    <!-- Notch -->
    <rect x="40" y="5" width="40" height="10" rx="5" fill="#000"/>

    <!-- Search bar -->
    <rect x="12" y="30" width="96" height="24" rx="12" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
    <circle cx="24" cy="42" r="6" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="28" y1="46" x2="32" y2="50" stroke="#999" stroke-width="1.5"/>
    <text x="40" y="46" font-family="Arial, sans-serif" font-size="8" fill="#666">pizza near me</text>

    <!-- Location indicator -->
    <rect x="12" y="60" width="96" height="16" rx="3" fill="#e3f2fd"/>
    <circle cx="22" cy="68" r="4" fill="#3498db"/>
    <text x="30" y="71" font-family="Arial, sans-serif" font-size="7" fill="#3498db">Manhattan, NY</text>

    <!-- Filter pills -->
    <rect x="12" y="82" width="35" height="14" rx="7" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <text x="29" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#666">Open Now</text>
    <rect x="50" y="82" width="25" height="14" rx="7" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <text x="62" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#666">$$</text>
    <rect x="78" y="82" width="28" height="14" rx="7" fill="#fff" stroke="#ddd" stroke-width="1"/>
    <text x="92" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#666">4.0+</text>

    <!-- Placeholder content -->
    <rect x="12" y="102" width="96" height="70" rx="4" fill="#f8f8f8"/>
    <text x="60" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#bbb">Searching...</text>

    <!-- Label -->
    <text x="60" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#3498db">1. Search</text>
    <text x="60" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">"pizza near me"</text>
  </g>

  <!-- Arrow -->
  <path d="M175 150 L195 150" stroke="#999" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Flow 2: Results -->
  <g transform="translate(210, 50)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="120" height="200" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
    <rect x="6" y="22" width="108" height="155" rx="4" fill="#fff"/>

    <!-- Notch -->
    <rect x="40" y="5" width="40" height="10" rx="5" fill="#000"/>

    <!-- Results header -->
    <rect x="6" y="22" width="108" height="20" fill="#f5f5f5"/>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#333">12 Results</text>

    <!-- Result 1 (highlighted) -->
    <rect x="10" y="46" width="100" height="40" rx="4" fill="#fff" stroke="#3498db" stroke-width="1.5"/>
    <rect x="14" y="50" width="32" height="32" rx="3" fill="#e8d5b7"/>
    <text x="30" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🍕</text>
    <text x="52" y="58" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#333">Joe's Pizza</text>
    <text x="52" y="68" font-family="Arial, sans-serif" font-size="6" fill="#f39c12">★★★★☆</text>
    <text x="80" y="68" font-family="Arial, sans-serif" font-size="6" fill="#666">4.5</text>
    <text x="52" y="78" font-family="Arial, sans-serif" font-size="6" fill="#999">0.3 mi · $$</text>

    <!-- Result 2 -->
    <rect x="10" y="90" width="100" height="40" rx="4" fill="#fff" stroke="#eee" stroke-width="1"/>
    <rect x="14" y="94" width="32" height="32" rx="3" fill="#ffe4e1"/>
    <text x="30" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🍝</text>
    <text x="52" y="102" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#333">Bella Italia</text>
    <text x="52" y="112" font-family="Arial, sans-serif" font-size="6" fill="#f39c12">★★★★☆</text>
    <text x="80" y="112" font-family="Arial, sans-serif" font-size="6" fill="#666">4.2</text>
    <text x="52" y="122" font-family="Arial, sans-serif" font-size="6" fill="#999">0.5 mi · $$$</text>

    <!-- Result 3 -->
    <rect x="10" y="134" width="100" height="40" rx="4" fill="#fff" stroke="#eee" stroke-width="1"/>
    <rect x="14" y="138" width="32" height="32" rx="3" fill="#e8f5e9"/>
    <text x="30" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16">🥗</text>
    <text x="52" y="146" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#333">Pizza Garden</text>
    <text x="52" y="156" font-family="Arial, sans-serif" font-size="6" fill="#f39c12">★★★★☆</text>
    <text x="80" y="156" font-family="Arial, sans-serif" font-size="6" fill="#666">4.0</text>
    <text x="52" y="166" font-family="Arial, sans-serif" font-size="6" fill="#999">0.8 mi · $$</text>

    <!-- Label -->
    <text x="60" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9b59b6">2. Results</text>
    <text x="60" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Ranked list</text>
  </g>

  <!-- Arrow -->
  <path d="M345 150 L365 150" stroke="#999" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Flow 3: Business Page -->
  <g transform="translate(380, 50)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="120" height="200" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
    <rect x="6" y="22" width="108" height="155" rx="4" fill="#fff"/>

    <!-- Notch -->
    <rect x="40" y="5" width="40" height="10" rx="5" fill="#000"/>

    <!-- Hero image area -->
    <rect x="6" y="22" width="108" height="50" fill="#e8d5b7"/>
    <text x="60" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="24">🍕</text>

    <!-- Business info -->
    <text x="60" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#333">Joe's Pizza</text>
    <text x="60" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#f39c12">★★★★☆ 4.5</text>
    <text x="60" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#666">(234 reviews)</text>

    <!-- Details -->
    <rect x="12" y="112" width="96" height="30" rx="4" fill="#f8f8f8"/>
    <text x="18" y="124" font-family="Arial, sans-serif" font-size="6" fill="#27ae60">● Open</text>
    <text x="48" y="124" font-family="Arial, sans-serif" font-size="6" fill="#666">until 10pm</text>
    <text x="18" y="135" font-family="Arial, sans-serif" font-size="6" fill="#666">📍 123 Main St</text>

    <!-- Action buttons -->
    <rect x="12" y="148" width="45" height="20" rx="4" fill="#e74c3c"/>
    <text x="34" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#fff">Call</text>
    <rect x="63" y="148" width="45" height="20" rx="4" fill="#3498db"/>
    <text x="85" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#fff">Directions</text>

    <!-- Label -->
    <text x="60" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#27ae60">3. Business Page</text>
    <text x="60" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Details + Rating</text>
  </g>

  <!-- Arrow -->
  <path d="M515 150 L535 150" stroke="#999" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Flow 4: Reviews -->
  <g transform="translate(550, 50)">
    <!-- Phone frame -->
    <rect x="0" y="0" width="120" height="200" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="2"/>
    <rect x="6" y="22" width="108" height="155" rx="4" fill="#fff"/>

    <!-- Notch -->
    <rect x="40" y="5" width="40" height="10" rx="5" fill="#000"/>

    <!-- Reviews header -->
    <rect x="6" y="22" width="108" height="20" fill="#f5f5f5"/>
    <text x="60" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#333">Reviews</text>

    <!-- Write review button -->
    <rect x="12" y="46" width="96" height="22" rx="4" fill="#e74c3c"/>
    <text x="60" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#fff">✏️ Write a Review</text>

    <!-- Review 1 -->
    <rect x="12" y="72" width="96" height="48" rx="4" fill="#fff" stroke="#eee" stroke-width="1"/>
    <circle cx="24" cy="84" r="8" fill="#c5cae9"/>
    <text x="24" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#3f51b5">J</text>
    <text x="38" y="82" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#333">John D.</text>
    <text x="38" y="90" font-family="Arial, sans-serif" font-size="6" fill="#f39c12">★★★★★</text>
    <text x="14" y="102" font-family="Arial, sans-serif" font-size="5" fill="#666">Best pizza in NYC! The</text>
    <text x="14" y="110" font-family="Arial, sans-serif" font-size="5" fill="#666">crust is perfect...</text>

    <!-- Review 2 -->
    <rect x="12" y="124" width="96" height="48" rx="4" fill="#fff" stroke="#eee" stroke-width="1"/>
    <circle cx="24" cy="136" r="8" fill="#ffcdd2"/>
    <text x="24" y="139" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e53935">S</text>
    <text x="38" y="134" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#333">Sarah M.</text>
    <text x="38" y="142" font-family="Arial, sans-serif" font-size="6" fill="#f39c12">★★★★☆</text>
    <text x="14" y="154" font-family="Arial, sans-serif" font-size="5" fill="#666">Great food, service was</text>
    <text x="14" y="162" font-family="Arial, sans-serif" font-size="5" fill="#666">a bit slow though.</text>

    <!-- Label -->
    <text x="60" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f39c12">4. Reviews</text>
    <text x="60" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">Read / Write</text>
  </g>

  <!-- Mini map decoration -->
  <g transform="translate(700, 60)">
    <rect x="0" y="0" width="70" height="70" rx="6" fill="#e8f5e9" stroke="#c8e6c9" stroke-width="1"/>
    <circle cx="35" cy="35" r="25" fill="none" stroke="#81c784" stroke-width="1" stroke-dasharray="3,2"/>
    <circle cx="35" cy="35" r="4" fill="#e74c3c"/>
    <circle cx="25" cy="25" r="3" fill="#f39c12"/>
    <circle cx="50" cy="30" r="3" fill="#f39c12"/>
    <circle cx="30" cy="50" r="3" fill="#f39c12"/>
    <text x="35" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#666">Geo Search</text>
  </g>
</svg>
