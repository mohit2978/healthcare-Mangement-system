<svg viewBox="0 0 650 210" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="650" height="210" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="325.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Idempotency Keys</text><rect x="20" y="20" width="220" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="130.0" y="46.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">request, key=K</text><polygon points="360.0,10 460,42.5 360.0,75 260,42.5" fill="#fff9db" stroke="#f08c00" stroke-width="1.5"/><text x="360.0" y="46.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">"seen K?"</text><line x1="240" y1="42" x2="260" y2="42" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="20" y="130" width="280" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="160.0" y="155.83333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">no: charge once, store result under K</text><rect x="340" y="130" width="280" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="480.0" y="149.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">yes (retry): return the same stored</text><text x="480.0" y="162.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">result</text><path d="M300,75 Q220,100 160,130" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="220" y="94" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">no</text><path d="M440,75 Q460,100 480,130" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="460" y="94" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">yes</text></svg>