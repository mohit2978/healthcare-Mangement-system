<svg viewBox="0 0 650 210" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="650" height="210" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="325.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Sagas and Compensation</text><rect x="20" y="20" width="220" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="130.0" y="46.0" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10.5" fill="#1a1a2e">1. authorize (succeeds)</text><line x1="240" y1="42" x2="300" y2="42" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="300" y="20" width="220" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="410.0" y="46.166666666666664" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">2. capture</text><rect x="20" y="120" width="240" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="140.0" y="146.16666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#1a1a2e">succeeds: done</text><rect x="300" y="120" width="320" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="460.0" y="145.66666666666666" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">fails: compensate — void the authorization</text><path d="M360,65 Q230,90 140,120" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="230" y="84" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="11" fill="#495057">succeeds</text><path d="M410,65 Q440,90 460,120" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="440" y="84" text-anchor="middle" font