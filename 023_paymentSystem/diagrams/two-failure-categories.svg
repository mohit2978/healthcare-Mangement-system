<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif"><rect width="700" height="220" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><text x="350.0" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#212529">Two Failure Categories</text><text x="20" y="30" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Unobserved failure — no response arrives at all:</text><rect x="20" y="45" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="115.0" y="70.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">capture times out</text><rect x="244" y="45" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="339.0" y="70.66666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">in_doubt</text><line x1="210" y1="67.5" x2="244" y2="67.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="468" y="45" width="190" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="563.0" y="64.41666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">resolved later by</text><text x="563.0" y="76.91666666666667" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="9.5" fill="#1a1a2e">reconciliation</text><line x1="434" y1="67.5" x2="468" y2="67.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/><text x="20" y="145" text-anchor="start" font-family='Segoe UI, Arial, sans-serif' font-size="11.5" fill="#495057">Observed failure — a step returns an explicit error:</text><rect x="20" y="160" width="220" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="130.0" y="185.83333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">capture fails</text><rect x="274" y="160" width="220" height="45" rx="8" fill="#eef4ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="384.0" y="179.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">saga compensates: reversing</text><text x="384.0" y="192.33333333333334" text-anchor="middle" font-family='Segoe UI, Arial, sans-serif' font-size="10" fill="#1a1a2e">refund</text><line x1="240" y1="182.5" x2="274" y2="182.5" stroke="#495057" stroke-width="1.6" marker-end="url(#arrow)"/></svg>